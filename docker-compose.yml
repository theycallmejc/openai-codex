# Optional reference. The verified hackathon runtime is local Python.
services:
  app:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SDLC_ENVIRONMENT: container-reference
      FLOWPILOT_SESSION_SECRET: ${FLOWPILOT_SESSION_SECRET:-change-this-before-shared-deployment}
      FLOWPILOT_SESSION_HTTPS_ONLY: "false"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
