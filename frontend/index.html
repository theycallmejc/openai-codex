<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automated SDLC-to-QA</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main><h1>Automated SDLC-to-QA</h1><p>Deterministic workflow: requirement → BRD → backlog → tests → QA handoff.</p>
