name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q backend scripts
      - run: python -m pytest backend/tests --cov=backend.src --cov-fail-under=70 -q
      - run: python -m json.tool postman/collection.json && python -m json.tool sample-data/sample-requirements.json
      - run: python scripts/demo.py > demo-evidence.json
      - run: pip-audit -r backend/requirements.txt
